  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

    .card {
      background: #ffffff;

    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #e0f2fe;
      color: #0284c7;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .links {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .links a {
      display: block;
      padding: 12px;
      background: #f1f5f9;
      color: #334155;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 500;
      transition: background 0.2s;
    }
    .links a:hover {
      background: #e2e8f0;
      color: #0f172a;
    }
    footer {
      margin-top: 30px;
      font-size: 13px;
      color: #94a3b8;
